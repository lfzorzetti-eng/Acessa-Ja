<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Acessa Já - Página inicial">
      <img src="logo.svg" alt="Acessa Já" class="brand-logo" />
      <span class="brand-copy">
        <strong>Acessa Já</strong>
        <span>Radar de Acessibilidade</span>
      </span>
    </a>

    <nav class="main-nav" aria-label="Navegação principal">
      <a
        mat-button
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>explore</mat-icon>
        <span>Dashboard</span>
      </a>
      <a
        mat-button
        routerLink="/report"
        routerLinkActive="active-link">
        <mat-icon>add_location_alt</mat-icon>
        <span>Relatar barreira</span>
      </a>
    </nav>

    <a mat-flat-button class="accent-button topbar-action" routerLink="/report">
      <mat-icon>add</mat-icon>
      <span>Novo relato</span>
    </a>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <span>Cada caminho livre começa com um relato.</span>
    <span class="footer-mark"><mat-icon>location_on</mat-icon> Ruas mais seguras, bairro por bairro</span>
  </footer>
</div>
