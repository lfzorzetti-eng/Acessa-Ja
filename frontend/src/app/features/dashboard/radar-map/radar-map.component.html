<div class="map-shell" [class.is-fullscreen]="isFullscreen">
  <div
    #mapHost
    class="map-canvas"
    role="application"
    aria-label="Mapa interativo de relatos de acessibilidade">
  </div>

  <div class="map-search">
    <mat-icon class="search-icon">{{ isSearching ? 'hourglass_top' : 'search' }}</mat-icon>
    <input
      type="search"
      class="search-input"
      placeholder="Buscar rua, bairro ou cidade"
      aria-label="Buscar um lugar no mapa"
      [value]="searchQuery"
      (input)="onSearchInput($any($event.target).value)"
      (keydown.enter)="$event.preventDefault(); submitSearch()">
    <button
      type="button"
      class="search-clear"
      *ngIf="searchQuery"
      aria-label="Limpar busca"
      (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="search-results" *ngIf="searchResults.length > 0 || searchStatus">
      <button
        type="button"
        class="search-result"
        *ngFor="let result of searchResults"
        [title]="result.displayName"
        (click)="selectSearchResult(result)">
        <mat-icon>place</mat-icon>
        <span>{{ result.displayName }}</span>
      </button>
      <p class="search-status" *ngIf="searchStatus">{{ searchStatus }}</p>
    </div>
  </div>

  <div class="map-toolbar" role="toolbar" aria-label="Controles do mapa">
    <button
      type="button"
      class="map-control"
      [disabled]="isLocating"
      [attr.aria-label]="isLocating ? 'Localizando...' : 'Centralizar no meu local'"
      [title]="isLocating ? 'Localizando...' : 'Meu local'"
      (click)="locateUser()">
      <mat-icon>{{ isLocating ? 'my_location' : 'near_me' }}</mat-icon>
    </button>
    <button
      type="button"
      class="map-control"
      aria-label="Mostrar todos os relatos e meu local"
      title="Ajustar mapa"
      (click)="fitReports()">
      <mat-icon>fit_screen</mat-icon>
    </button>
    <button
      type="button"
      class="map-control"
      [attr.aria-label]="isFullscreen ? 'Sair da tela cheia' : 'Tela cheia'"
      [title]="isFullscreen ? 'Sair da tela cheia' : 'Tela cheia'"
      (click)="toggleFullscreen()">
      <mat-icon>{{ isFullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
    </button>
  </div>

  <div class="map-legend" aria-label="Legenda do mapa">
    <span class="legend-title">Quem afeta</span>
    <span class="legend-item" *ngFor="let item of needLegend">
      <i class="legend-dot" [style.background]="item.color"></i>{{ item.label }}
    </span>
    <span class="legend-severity">Ponto = gravidade</span>
  </div>

  <div class="map-hint" *ngIf="issues.length > 0">
    <mat-icon>touch_app</mat-icon>
    <span>Toque no mapa para relatar uma barreira neste ponto</span>
  </div>

  <div class="map-empty" *ngIf="issues.length === 0">
    <mat-icon>map</mat-icon>
    <span>Ainda não há relatos no mapa</span>
  </div>
</div>
